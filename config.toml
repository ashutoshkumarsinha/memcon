[app]
version = "1.0"
default_model = "llama3"
description = "Local ambient memory manager and LLM execution proxy."

[provider]
# Pick your default backend — set exactly one flag to true.
# Overridden by --provider or MEMCON_PROVIDER.
use_ollama = true
use_paid = false
use_kiro = false

# When use_paid = true, choose the paid API:
paid_provider = "anthropic"  # anthropic | openai

# Legacy fallback when all use_* flags are false:
name = "ollama"

[paths]
# Resolved under the user home directory unless MEMCON_CONFIG_DIR is set.
config_subdir = ".config/memcon"
global_config_file = "global.json"
history_file = "history.json"
project_context_file = ".memcon"
ignore_file = ".memconignore"

[ollama]
host = "http://localhost:11434"
chat_endpoint = "/api/chat"
default_model = "llama3"
timeout_seconds = 600
stream = true

[anthropic]
base_url = "https://api.anthropic.com"
messages_endpoint = "/v1/messages"
api_key_env = "ANTHROPIC_API_KEY"
api_version = "2023-06-01"
default_model = "claude-sonnet-4-20250514"
max_output_tokens = 4096
timeout_seconds = 600
stream = true

[openai]
base_url = "https://api.openai.com"
chat_endpoint = "/v1/chat/completions"
api_key_env = "OPENAI_API_KEY"
default_model = "gpt-4o"
max_output_tokens = 4096
timeout_seconds = 600
stream = true

[kiro]
# mode: "acp" (JSON-RPC agent protocol, streaming) or "headless" (kiro-cli chat --no-interactive)
mode = "acp"
cli_path = "kiro-cli"
api_key_env = "KIRO_API_KEY"
default_model = "default"
timeout_seconds = 600
auto_approve_tools = true

[history]
max_entries = 50
display_limit = 10
prompt_preview_length = 80

[tokens]
plain_text_divisor = 3.9
dense_code_divisor = 3.4
symbol_density_threshold = 0.02
code_symbols_pattern = """[\\{\\}\\[\\]]|=>"""

[workspace]
scan_max_depth = 3
invariant_ignore_dirs = [
  ".git",
  "node_modules",
  "__pycache__",
  ".venv",
  "venv",
  "dist",
  "build",
]
invariant_ignore_files = [".memcon", ".memconignore", ".DS_Store"]
allowed_extensions = [
  ".py", ".js", ".ts", ".jsx", ".tsx",
  ".go", ".rs", ".html", ".css",
  ".json", ".md", ".txt", ".yml", ".yaml",
]

[[budgets.rules]]
patterns = ["kiro", "claude-opus", "opus-4", "gpt-4.1"]
tokens = 128000

[[budgets.rules]]
patterns = ["claude-sonnet", "sonnet-4", "gpt-4o"]
tokens = 128000

[[budgets.rules]]
patterns = ["claude-haiku", "haiku", "gpt-4o-mini", "gpt-3.5"]
tokens = 128000

[[budgets.rules]]
patterns = ["70b"]
tokens = 16000

[[budgets.rules]]
patterns = ["32b", "14b"]
tokens = 8000

[[budgets.rules]]
patterns = ["8b", "llama3", "phi3"]
tokens = 4000

[budgets]
default_tokens = 4000

[global_defaults]
persona = "You are a helpful local coding assistant."
style = "Be concise and precise."
model = "llama3"
